<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}">
<meta charset="UTF-8">
<title>联系</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle, #0f0f2f, #000000);
        color: #00ffe7;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; /* 背景层 */
        background: radial-gradient(circle, #0f0f2f, #000000);
    }

    .blog-box {
        background: rgba(17, 17, 34, 0.85);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 0 20px #00ffe7;
        text-align: center;
        width: 300px;
    }

    .blog-box h2 {
        margin-bottom: 20px;
        font-size: 1.5em;
        color: #00ffe7;
        text-shadow: 0 0 10px #00ffe7;
    }

    .blog-box input[type="password"] {
        width: 90%;
        padding: 10px;
        margin: 15px 0;
        border: none;
        border-radius: 6px;
        background: #111122;
        color: #00ffe7;
        font-size: 1em;
        box-shadow: inset 0 0 10px #00ffe7;
    }

    .blog-box button {
        width: 100%;
        padding: 10px;
        background: #00ffe7;
        color: #000;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .blog-box button:hover {
        background: #00cccc;
    }

    .error {
        color: #ff4444;
        margin-top: 10px;
    }

    .blog-box form button {
        display: block;     /* 每个按钮独占一行 */
        margin-top: 10px;   /* 每个按钮上方留空 */
    }


</style>
</head>
<body>
<canvas id="starfield"></canvas>

<div class="blog-box">
    <h2>开发中，敬请期待</h2>
    <button type="button" onclick="window.location.href='{{ url_for('index') }}'">返回</button>
</div>

<script>
// 星空Canvas逻辑
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const numStars = 500;
const stars = [];
const maxZ = window.innerWidth;
const speed = 0.5;

for (let i = 0; i < numStars; i++) {
    stars.push({
        x: Math.random() * canvas.width - canvas.width / 2,
        y: Math.random() * canvas.height - canvas.height / 2,
        z: Math.random() * maxZ,
        size: Math.random() * 2 + 1
    });
}

function updateStars() {
    for (let star of stars) {
        star.z -= speed;
        if (star.z <= 0) {
            star.x = Math.random() * canvas.width - canvas.width / 2;
            star.y = Math.random() * canvas.height - canvas.height / 2;
            star.z = maxZ;
            star.size = Math.random() * 2 + 1;
        }
    }
}

function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let star of stars) {
        const sx = (star.x / star.z) * canvas.width + canvas.width / 2;
        const sy = (star.y / star.z) * canvas.height + canvas.height / 2;
        const radius = (1 - star.z / maxZ) * star.size * 2;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(0,255,255,${1 - star.z / maxZ})`;
        ctx.fill();
    }
}

function animateStars() {
    updateStars();
    drawStars();
    requestAnimationFrame(animateStars);
}
animateStars();
</script>
</body>
</html>
